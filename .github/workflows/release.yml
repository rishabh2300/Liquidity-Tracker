name: Build Windows Release

# Runs when a release tag (app-v*) is pushed, or manually from the Actions
# tab. Builds the signed Windows installer and uploads it — together with the
# auto-update manifest (latest.json) — as a DRAFT release on THIS repo.
# Publish the draft to roll the update out to every installed PC.
on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

# Needed for the built-in GITHUB_TOKEN to create the release on this repo.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          # Built-in token — sufficient because we release to this same repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (keypair of 2026-07-28).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # We ship NSIS only; keep latest.json pointing at the .exe.
          updaterJsonPreferNsis: true
          tagName: app-v__VERSION__
          releaseName: 'Liquidity Tracker v__VERSION__'
          releaseBody: 'Fresh installs: download the -setup.exe. Installed apps pick this update up automatically on next launch.'
          releaseDraft: true
          prerelease: false
