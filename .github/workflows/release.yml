name: Build Windows Release

# Runs when a release tag (app-v*) is pushed, or manually from the Actions
# tab. Builds the signed Windows installers and uploads them — together with
# the auto-update manifest (latest.json) — as a DRAFT release on the public
# releases repo (liquidity-tracker-releases). Publish the draft there to roll
# the update out to every installed PC.
on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          # PAT with write access to the public releases repo.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Updater artifact signing (keypair of 2026-07-28).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: rishabh2300
          repo: liquidity-tracker-releases
          # Required when releasing to another repo: this commit SHA doesn't
          # exist there, so target that repo's default branch instead.
          releaseCommitish: main
          # We ship NSIS only; keep latest.json pointing at the .exe.
          updaterJsonPreferNsis: true
          tagName: app-v__VERSION__
          releaseName: 'Liquidity Tracker v__VERSION__'
          releaseBody: 'Fresh installs: download the -setup.exe. Installed apps pick this update up automatically on next launch.'
          releaseDraft: true
          prerelease: false
